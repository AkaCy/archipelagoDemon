<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArchipelageDemon</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <!-- Compteur de points en haut à droite -->
        <div id="points">
            Points : <span id="points-value">0</span>
        </div>

        <!-- Contenu principal -->
        <div id="content">

            <h1>Mon jeu</h1>

            <div id="status">
                Tu gagnes 1 point toutes les 5 secondes.
            </div>

            <button id="upgrade-button">
                Acheter l'amélioration (3 points)
            </button>

        </div>

    </div>

    <!-- Notre code de jeu -->
    <script src="game.js"></script>

</body>

</html>
